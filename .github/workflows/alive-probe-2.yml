              r=urllib.request.urlopen(req,timeout=30); print("PUT",r.status)
          except Exception as e:
              print("PUT failed",repr(e)[:300])
          PYEOF
          cat /tmp/out.txt >> $GITHUB_STEP_SUMMARY || true
