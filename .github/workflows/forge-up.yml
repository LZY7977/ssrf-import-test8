name: forge-up
on: push
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - name: upload
        run: |
          cat > /tmp/spec.b64 <<'EOF'
          
          EOF
          tr -d ' \n' < /tmp/spec.b64 | base64 -d > /tmp/spec.json
          echo  | base64 -d > /tmp/u.py
          python3 /tmp/u.py
